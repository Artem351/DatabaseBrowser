[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "database-browser-connections"
version = "0.1.1"
description = "Database Browser: SQLite connections and index management"
requires-python = ">=3.12"
dependencies = ["PyQt6>=6.7,<7"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
database-browser = "database_browser.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyqt6"

